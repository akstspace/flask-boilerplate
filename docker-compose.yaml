# ⚠️  WARNING: This docker-compose.yaml contains DEVELOPMENT-ONLY defaults.
# These credentials and secrets are insecure and must NOT be used in staging/production.
# For production deployments, use:
#   - Docker secrets (docker secret create)
#   - External secret managers (AWS Secrets Manager, HashiCorp Vault, Azure Key Vault)
#   - Kubernetes secrets (if using K8s)
# Always provide strong, randomly generated values for all secrets via environment variables.
# See .env.example for required environment variables and SETUP.md for secure deployment instructions.

services:
  # PostgreSQL Database
  postgres:
    image: postgres:18.1-alpine
    container_name: flask_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-in-production}
      POSTGRES_DB: ${DB_NAME:-flask_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flask_network

  # Redis (Celery Broker & Result Backend)
  redis:
    image: redis:8.4.0-alpine
    container_name: flask_redis
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flask_network

  # Flask Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flask_web
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-in-production}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-flask_db}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-change-me-in-production}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-flask_db}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-master}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-flask-app}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: gunicorn --bind 0.0.0.0:8000 --workers 4 --timeout 60 run:app
    networks:
      - flask_network
    restart: unless-stopped

  # Celery Worker
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flask_celery_worker
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-in-production}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-flask_db}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-change-me-in-production}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-flask_db}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: celery -A app.celery worker --loglevel=info
    networks:
      - flask_network
    restart: unless-stopped

  # Celery Beat (Optional - for scheduled tasks)
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flask_celery_beat
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-in-production}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-flask_db}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-change-me-in-production}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-flask_db}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: celery -A app.celery beat --loglevel=info
    networks:
      - flask_network
    restart: unless-stopped


networks:
  flask_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
