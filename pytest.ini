[pytest]
# Minimum pytest version required
minversion = 7.0

# Test discovery patterns
# pytest will look for files matching these patterns
python_files = test_*.py *_test.py
python_classes = Test* *Tests
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Command line options to always use
addopts =
    # Verbose output showing each test name
    -v
    # Show extra test summary info for all test outcomes except passes
    -ra
    # Enable strict markers - unregistered markers will raise errors
    --strict-markers
    # Show local variables in tracebacks for debugging
    --showlocals
    # Enable coverage reporting
    --cov=app
    --cov=src
    # Coverage report options
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    # Fail if coverage is below 80%
    --cov-fail-under=80
    # Don't display coverage for test files themselves
    --cov-config=.coveragerc
    # Capture output - show print statements only on failure
    --capture=no
    # Show warnings
    -W default
    # Fail on first test failure (useful for CI, comment out for local dev)
    # -x
    # Run tests in parallel (requires pytest-xdist)
    # -n auto
    # Maximum line length for assertion rewriting
    --tb=short

# Register custom markers to categorize tests
# Usage: @pytest.mark.slow
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    api: marks tests that test API endpoints
    database: marks tests that require database
    security: marks security-related tests
    smoke: marks critical smoke tests for quick validation
    flaky: marks tests that are known to be flaky
    requires_network: marks tests requiring network access

# Configure logging
# Capture log messages and show them in test output
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# File logging configuration
log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (requires pytest-timeout)
# Prevents tests from hanging indefinitely
timeout = 300
timeout_method = thread

# Console output formatting
console_output_style = progress

# Filter warnings
# Convert specific warnings to errors
filterwarnings =
    error::DeprecationWarning
    error::PendingDeprecationWarning
    # Ignore specific warnings from third-party libraries
    ignore::UserWarning:flask
    ignore::DeprecationWarning:werkzeug

# Ignore certain paths during test collection
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    .venv
    venv
    node_modules
    .pytest_cache
    htmlcov

# Environment variables for testing
# These can be set automatically when pytest runs
env =
    FLASK_ENV=testing
    TESTING=1
    DATABASE_URL=sqlite:///:memory:

# Doctest configuration (if using doctests)
doctest_optionflags = 
    NORMALIZE_WHITESPACE
    IGNORE_EXCEPTION_DETAIL
    ELLIPSIS

# XFail strict mode - xfail tests that pass will fail the test suite
xfail_strict = false

# Consider tests with no assertions as failures
# Helps catch incomplete tests
junit_family = xunit2

# Generate JUnit XML reports for CI/CD systems
junit_suite_name = Flask Application Test Suite

# Asyncio configuration (if using async tests)
asyncio_mode = auto

# Cache configuration
cache_dir = .pytest_cache